name: Build Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak tools
        run: |
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder librsvg2-bin

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Cache Flatpak runtime
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-${{ runner.os }}-25.08-${{ hashFiles('org.schelstraete.boosteroid.yml') }}
          restore-keys: |
            flatpak-${{ runner.os }}-25.08-

      - name: Install runtime and SDK
        run: |
          flatpak install --user -y flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08

      - name: Build Flatpak
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$REF_NAME" > version.txt
          VERSION="${REF_NAME#v}"
          # M-001: Validate version format before using in sed to prevent pattern injection.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version format: $VERSION" >&2; exit 1
          fi
          DATE="$(date +%Y-%m-%d)"
          sed -i "s/FLATPAK_VERSION/$VERSION/; s/FLATPAK_DATE/$DATE/" org.schelstraete.boosteroid.metainfo.xml
          rsvg-convert -w 1920 -h 620 src/steam-hero.svg        -o src/steam-hero.png
          rsvg-convert -w 600  -h 900 src/steam-capsule.svg    -o src/steam-capsule.png
          rsvg-convert -w 920  -h 430 src/steam-wide.svg        -o src/steam-wide.png
          rsvg-convert -w 880  -h 280 src/steam-logo.svg        -o src/steam-logo.png
          rsvg-convert -w 968  -h 478 src/splash-logo.svg              -o src/splash-logo.png
          rsvg-convert -w 256  -h 256 org.schelstraete.boosteroid.svg -o src/icon-256.png
          flatpak-builder \
            --user \
            --install-deps-from=flathub \
            --force-clean \
            --repo=repo \
            build-dir \
            org.schelstraete.boosteroid.yml

      - name: Bundle Flatpak
        run: |
          flatpak build-bundle repo \
            org.schelstraete.boosteroid.flatpak \
            org.schelstraete.boosteroid

      # H-001: Generate SHA-256 checksum so install.sh can verify the download.
      - name: Generate SHA-256 checksum
        run: |
          sha256sum org.schelstraete.boosteroid.flatpak > org.schelstraete.boosteroid.flatpak.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: boosteroid-flatpak
          path: org.schelstraete.boosteroid.flatpak
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        # M-002: Pinned to commit SHA to prevent supply-chain risk from mutable tag.
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2
        with:
          files: |
            org.schelstraete.boosteroid.flatpak
            org.schelstraete.boosteroid.flatpak.sha256
            install.sh
            boosteroid-steamos.desktop
          generate_release_notes: true
